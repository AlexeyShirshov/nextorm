<text x="44" y="708" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#94a3b8">QueryPlanStore is bypassed on this path: Prepare() calls the planner with storeInCache: false. InMemoryDataContext returns InMemoryPreparedQueryCommand; raw-SQL PrepareFromSql is not supported.</text>
