<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">NextORM — ORM для .NET</title>
  <desc id="d">Обложка: вордмарк NextORM, слоган на русском, теги возможностей и график сравнения скорости выборки данных на SQLite с Dapper, linq2db и EF Core.</desc>
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="barBest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#0b1220"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle cx="1010" cy="50" r="400" fill="url(#glowViolet)"/>
  <circle cx="110" cy="610" r="370" fill="url(#glowCyan)"/>

  <!-- left column -->
  <text x="64" y="214" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="16" font-weight="700" letter-spacing="3.6" fill="#a5b4fc">ZERO-SQL ORM ДЛЯ .NET</text>

  <text x="64" y="326" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="104" font-weight="700" letter-spacing="-2.5" fill="url(#wordmark)">NextORM</text>

  <text x="64" y="390" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0">Типизированный SQL из LINQ.</text>
  <text x="64" y="424" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="20" fill="#94a3b8">Без change tracking и обязательных сущностей</text>

  <g font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#c7d2fe">
    <rect x="64" y="470" width="138" height="36" rx="18" fill="#111d33" stroke="#2b3a55"/>
    <text x="133" y="493" text-anchor="middle">6 движков БД</text>
    <rect x="218" y="470" width="121" height="36" rx="18" fill="#111d33" stroke="#2b3a55"/>
    <text x="278" y="493" text-anchor="middle">Кэш планов</text>
    <rect x="355" y="470" width="181" height="36" rx="18" fill="#111d33" stroke="#2b3a55"/>
    <text x="445" y="493" text-anchor="middle">Сущности не нужны</text>
  </g>

  <text x="64" y="576" font-family="JetBrains Mono, Consolas, Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#94a3b8">alexeyshirshov.github.io/nextorm</text>

  <!-- benchmark panel -->
  <rect x="600" y="108" width="536" height="424" rx="20" fill="#0e1729" stroke="#2b3a55" stroke-width="1.4"/>

  <text x="636" y="166" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">3.5× быстрее EF Core</text>
  <text x="1100" y="166" text-anchor="end" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="13" fill="#8b9bb4">μs, меньше — лучше</text>

  <g>
    <rect x="740" y="212" width="300" height="26" rx="7" fill="#131f33"/>
    <rect x="740" y="212" width="84.3" height="26" rx="7" fill="url(#barBest)"/>
    <text x="720" y="231" text-anchor="end" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">NextORM</text>
    <text x="834" y="231" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#67e8f9">10.29 μs</text>

    <rect x="740" y="278" width="300" height="26" rx="7" fill="#131f33"/>
    <rect x="740" y="278" width="121.9" height="26" rx="7" fill="#475569"/>
    <text x="720" y="297" text-anchor="end" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="17" fill="#cbd5e1">Dapper</text>
    <text x="872" y="297" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="16" fill="#94a3b8">14.89 μs</text>

    <rect x="740" y="344" width="300" height="26" rx="7" fill="#131f33"/>
    <rect x="740" y="344" width="129" height="26" rx="7" fill="#475569"/>
    <text x="720" y="363" text-anchor="end" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="17" fill="#cbd5e1">linq2db</text>
    <text x="879" y="363" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="16" fill="#94a3b8">15.76 μs</text>

    <rect x="740" y="410" width="300" height="26" rx="7" fill="#131f33"/>
    <rect x="740" y="410" width="300" height="26" rx="7" fill="#475569"/>
    <text x="720" y="429" text-anchor="end" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="17" fill="#cbd5e1">EF Core</text>
    <text x="1050" y="429" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="16" fill="#94a3b8">36.64 μs</text>
  </g>

  <line x1="636" y1="470" x2="1100" y2="470" stroke="#1e293b"/>
  <text x="636" y="498" font-family="Inter, Segoe UI, Ubuntu, DejaVu Sans, sans-serif" font-size="12" fill="#64748b">BenchmarkDotNet · async · AMD Ryzen 7 5800HS · .NET 10</text>
</svg>
