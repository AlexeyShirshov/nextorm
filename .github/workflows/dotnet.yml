# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  # Every push to every branch (and tag): the run is attached to the commit, so it also shows up
  # in the "Checks" tab of any pull request - no separate pull_request trigger needed.
  push:

# Cancel a superseded run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIN_LINE_COVERAGE: 75

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Restore local tools
        run: dotnet tool restore
      - name: Test with coverage
        run: |
          mkdir -p test/coverage
          dotnet tool run dotnet-coverage collect -s coverage.settings.xml -f cobertura -o test/coverage/coverage.cobertura.xml "dotnet test --no-build --verbosity normal"
      - name: Coverage report
        run: |
          dotnet tool run reportgenerator \
            -reports:test/coverage/coverage.cobertura.xml \
            -targetdir:test/coverage/report \
            -reporttypes:"Html;TextSummary;Cobertura" \
            -riskhotspotassemblyfilters:"+nextorm.*"
      - name: Enforce line coverage threshold
        run: |
          LINE=$(grep -oP 'Line coverage: \K[0-9.]+' test/coverage/report/Summary.txt)
          echo "Line coverage: ${LINE}% (threshold: ${MIN_LINE_COVERAGE}%)"
          if awk -v c="$LINE" -v min="$MIN_LINE_COVERAGE" 'BEGIN { exit (c + 0 < min) }'; then
            echo "Coverage OK"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "::error::Line coverage ${LINE}% is below the ${MIN_LINE_COVERAGE}% threshold"
            exit 1
          else
            echo "::warning::Line coverage ${LINE}% is below the ${MIN_LINE_COVERAGE}% threshold (hard-fails on main only)"
          fi
      - name: Coverage summary
        if: always()
        run: |
          SUMMARY=test/coverage/report/Summary.txt

          {
            if [ -f "$SUMMARY" ]; then
              LINE=$(grep -oP 'Line coverage: \K[0-9.]+' "$SUMMARY")
              BRANCH=$(grep -oP 'Branch coverage: \K[0-9.]+' "$SUMMARY")

              echo "## Line coverage: ${LINE}% (threshold: ${MIN_LINE_COVERAGE}%)"
              echo
              echo "Branch coverage: ${BRANCH}%"
              echo
              if awk -v c="$LINE" -v min="$MIN_LINE_COVERAGE" 'BEGIN { exit (c + 0 < min) }'; then
                echo "Coverage threshold: **OK**"
              else
                echo "Coverage threshold: **FAILED**"
              fi
              echo
              echo "| Assembly | Line coverage |"
              echo "|---|---|"
              grep -E '^nextorm\.[a-z]+ +[0-9.]+%' "$SUMMARY" | tr -d '\r' | awk '{printf "| %s | %s |\n", $1, $NF}'
              echo
              echo "Full HTML report (with risk hotspots): artifact \`coverage-report\`, open \`report/index.html\`."
            else
              echo "## Coverage"
              echo
              echo "The coverage report was not produced - see the log of the previous steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: test/coverage/
          if-no-files-found: ignore
