# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  # Every push to every branch (and tag): the run is attached to the commit, so it also shows up
  # in the "Checks" tab of any pull request - no separate pull_request trigger needed.
  push:
  # Manual (re)publish of an existing tag, e.g. `v1.0.3-alpha`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.3-alpha)"
        required: true

# Cancel a superseded run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the GITHUB_TOKEN. The build job only reads the repository; the tag-triggered
# `publish` job re-declares its own block and adds `id-token: write` on top of this. Declared
# explicitly so the scope is documented and stays restricted if the repository default ever changes
# (CodeQL `actions/missing-workflow-permissions`).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIN_LINE_COVERAGE: 85
      MIN_BRANCH_COVERAGE: 75
      # Dedicated gate for the two live suites (built-in operators + extensions, real databases only).
      # #364 raised the branch threshold back to a hard 75 % after measuring 75.6 % on the built-in
      # suite (39595/52349). Adding nextorm.extensions.integration.tests keeps it at 75.3 % on
      # 2026-11-07. The 80 % campaign target was not reached: the remaining pool is structurally
      # unreachable or rare-refusal cases (#364 closing comment).
      MIN_INTEGRATION_LINE_COVERAGE: 65
      MIN_INTEGRATION_BRANCH_COVERAGE: 75

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Restore local tools
        run: dotnet tool restore
      - name: Test with coverage
        run: |
          mkdir -p tests/coverage
          # The opt-in diagnostic harnesses (Trait Category=Diagnostic) fail by design and are excluded
          # by the canonical command; a bare `dotnet test` would run them and turn every build red.
          # Test modules run one at a time: nextorm.integration.tests and
          # nextorm.extensions.integration.tests both drive the same reused Testcontainers instances
          # and seed the same tables, so concurrent modules collide ("Table ... already exists") and
          # the first module to finish stops the containers under the other one.
          dotnet tool run dotnet-coverage collect -s coverage.settings.xml -f cobertura -o tests/coverage/coverage.cobertura.xml "dotnet test --no-build --verbosity normal --filter-not-trait Category=Diagnostic --max-parallel-test-modules 1"
      - name: Integration coverage (dedicated gate)
        run: |
          mkdir -p tests/coverage
          # Both live suites contribute to this gate: the built-in operators project and the
          # extensions project (SelectGroup/SelectGroupHaving). They share the reused Testcontainers
          # instances and seed the same tables, so they run sequentially.
          # Each suite is collected as cobertura, and ReportGenerator unions the two reports:
          # dotnet-coverage merge cannot be used here — its cobertura output drops branch data
          # (covered/total branches come out as 0/0), which understates the branch gate.
          dotnet tool run dotnet-coverage collect -s coverage.integration.settings.xml -f cobertura -o tests/coverage/integration-builtin.cobertura.xml "dotnet test tests/nextorm.integration.tests --no-build --verbosity normal --filter-not-trait Category=Diagnostic"
          dotnet tool run dotnet-coverage collect -s coverage.integration.settings.xml -f cobertura -o tests/coverage/integration-extensions.cobertura.xml "dotnet test tests/nextorm.extensions.integration.tests --no-build --verbosity normal --filter-not-trait Category=Diagnostic"
          # The in-memory provider is unit-only by policy (AGENTS.md "Tests"), so its paths are outside
          # what the live suites can or should cover; excluded from this gate's denominator only.
          dotnet tool run reportgenerator \
            -reports:"tests/coverage/integration-builtin.cobertura.xml;tests/coverage/integration-extensions.cobertura.xml" \
            -targetdir:tests/coverage/integration-report \
            -reporttypes:"Html;TextSummary" \
            -classfilters:"-NextORM.Core.InMemory*" \
            -riskhotspotassemblyfilters:"+nextorm.*"
          SUMMARY=tests/coverage/integration-report/Summary.txt
          LINE=$(grep -oP 'Line coverage: \K[0-9.]+' "$SUMMARY")
          BRANCH=$(grep -oP 'Branch coverage: \K[0-9.]+' "$SUMMARY")
          echo "Integration line coverage: ${LINE}% (threshold: ${MIN_INTEGRATION_LINE_COVERAGE}%)"
          echo "Integration branch coverage: ${BRANCH}% (threshold: ${MIN_INTEGRATION_BRANCH_COVERAGE}%)"
          FAIL=0
          awk -v c="$LINE" -v min="$MIN_INTEGRATION_LINE_COVERAGE" 'BEGIN { exit (c + 0 < min) }' || FAIL=1
          awk -v c="$BRANCH" -v min="$MIN_INTEGRATION_BRANCH_COVERAGE" 'BEGIN { exit (c + 0 < min) }' || FAIL=1
          if [ "$FAIL" -eq 0 ]; then
            echo "Integration coverage OK"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "::error::Integration coverage below threshold (line ${LINE}% < ${MIN_INTEGRATION_LINE_COVERAGE}% or branch ${BRANCH}% < ${MIN_INTEGRATION_BRANCH_COVERAGE}%)"
            exit 1
          else
            echo "::warning::Integration coverage below threshold (line ${LINE}% < ${MIN_INTEGRATION_LINE_COVERAGE}% or branch ${BRANCH}% < ${MIN_INTEGRATION_BRANCH_COVERAGE}%); hard-fails on main only"
          fi
      - name: Benchmark table generator self-tests
        run: python3 -m unittest discover -s tools/benchmarks/tests -p 'test_update_benchmark_tables.py'
      - name: Coverage report
        run: |
          dotnet tool run reportgenerator \
            -reports:tests/coverage/coverage.cobertura.xml \
            -targetdir:tests/coverage/report \
            -reporttypes:"Html;TextSummary;Cobertura" \
            -riskhotspotassemblyfilters:"+nextorm.*"
      - name: Enforce coverage thresholds
        run: |
          SUMMARY=tests/coverage/report/Summary.txt
          LINE=$(grep -oP 'Line coverage: \K[0-9.]+' "$SUMMARY")
          BRANCH=$(grep -oP 'Branch coverage: \K[0-9.]+' "$SUMMARY")
          echo "Line coverage: ${LINE}% (threshold: ${MIN_LINE_COVERAGE}%)"
          echo "Branch coverage: ${BRANCH}% (threshold: ${MIN_BRANCH_COVERAGE}%)"
          FAIL=0
          awk -v c="$LINE" -v min="$MIN_LINE_COVERAGE" 'BEGIN { exit (c + 0 < min) }' || FAIL=1
          awk -v c="$BRANCH" -v min="$MIN_BRANCH_COVERAGE" 'BEGIN { exit (c + 0 < min) }' || FAIL=1
          if [ "$FAIL" -eq 0 ]; then
            echo "Coverage OK"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "::error::Coverage below threshold (line ${LINE}% < ${MIN_LINE_COVERAGE}% or branch ${BRANCH}% < ${MIN_BRANCH_COVERAGE}%)"
            exit 1
          else
            echo "::warning::Coverage below threshold (line ${LINE}% < ${MIN_LINE_COVERAGE}% or branch ${BRANCH}% < ${MIN_BRANCH_COVERAGE}%); hard-fails on main only"
          fi
      - name: Coverage summary
        if: always()
        run: |
          SUMMARY=tests/coverage/report/Summary.txt

          {
            if [ -f "$SUMMARY" ]; then
              LINE=$(grep -oP 'Line coverage: \K[0-9.]+' "$SUMMARY")
              BRANCH=$(grep -oP 'Branch coverage: \K[0-9.]+' "$SUMMARY")

              echo "## Line coverage: ${LINE}% (threshold: ${MIN_LINE_COVERAGE}%)"
              echo
              echo "## Branch coverage: ${BRANCH}% (threshold: ${MIN_BRANCH_COVERAGE}%)"
              echo
              LINE_OK=1; BRANCH_OK=1
              awk -v c="$LINE" -v min="$MIN_LINE_COVERAGE" 'BEGIN { exit (c + 0 < min) }' || LINE_OK=0
              awk -v c="$BRANCH" -v min="$MIN_BRANCH_COVERAGE" 'BEGIN { exit (c + 0 < min) }' || BRANCH_OK=0
              if [ "$LINE_OK" -eq 1 ] && [ "$BRANCH_OK" -eq 1 ]; then
                echo "Coverage thresholds: **OK**"
              else
                echo "Coverage thresholds: **FAILED** (line: $([ "$LINE_OK" -eq 1 ] && echo ok || echo low); branch: $([ "$BRANCH_OK" -eq 1 ] && echo ok || echo low))"
              fi
              echo
              echo "| Assembly | Line coverage |"
              echo "|---|---|"
              grep -E '^nextorm\.[a-z]+ +[0-9.]+%' "$SUMMARY" | tr -d '\r' | awk '{printf "| %s | %s |\n", $1, $NF}'
              echo
              echo "Full HTML report (with risk hotspots): artifact \`coverage-report\`, open \`report/index.html\`."
            else
              echo "## Coverage"
              echo
              echo "The coverage report was not produced - see the log of the previous steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: tests/coverage/
          if-no-files-found: ignore

  aot:
    # NativeAOT gate. Ordinary builds never produce the native binary and the harness skips itself
    # in that case, so this job publishes the runner and runs the harness with
    # NEXTORM_AOT_EVIDENCE=1, which turns the skip into a hard failure.
    # Coverage is deliberately partial and documented in docs/infrastructure/05-nativeaot.md:
    # .NET 10 / linux-x64 / SQLite scenarios plus extension component slices. The remaining
    # providers, the compile-time query pipeline and the residual IL2xxx/IL3xxx diagnostics are
    # tracked in #370; this job fails if the published binary stops starting or stops matching
    # the JIT oracle.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      # clang and the zlib headers ship with the GitHub-hosted Ubuntu image; apt-get is only a
      # fallback for image drift. When it is needed it has to retry: the runner's DNS lookup of
      # security.ubuntu.com fails intermittently ("Temporary failure resolving ...", exit 100),
      # which is a network blip on the host, not a defect of this repository.
      - name: Install NativeAOT prerequisites
        shell: bash
        run: |
          set -uo pipefail
          if command -v clang >/dev/null 2>&1 && [ -e /usr/include/zlib.h ]; then
            echo "already present: $(clang --version | head -n1); /usr/include/zlib.h"
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed, retrying in 20s"
            sleep 20
          done
          echo "::error::clang/zlib1g-dev could not be installed after 3 attempts"
          exit 1
      - name: Restore dependencies
        run: dotnet restore
      - name: Publish the NativeAOT runner
        shell: bash
        run: |
          set -o pipefail
          dotnet publish tests/nextorm.aot.runner -c Release -r linux-x64 2>&1 \
            | tee "$RUNNER_TEMP/aot-publish.log"
      - name: Run the published native binary
        env:
          NEXTORM_AOT_EVIDENCE: "1"
        run: dotnet test tests/nextorm.integration.tests --filter "FullyQualifiedName~AotNativeRunTests" --verbosity normal
      - name: Upload the NativeAOT diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aot-publish-log
          path: ${{ runner.temp }}/aot-publish.log
          if-no-files-found: ignore

  publish:
    # A tag push publishes to nuget.org; a manual run re-publishes an existing tag. Ordinary
    # branch pushes only build and test.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build, aot]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        run: dotnet restore
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          for project in \
            src/nextorm.core/nextorm.core.csproj \
            src/nextorm.sqlite/nextorm.sqlite.csproj \
            src/nextorm.sqlserver/nextorm.sqlserver.csproj \
            src/nextorm.postgres/nextorm.postgres.csproj \
            src/nextorm.mysql/nextorm.mysql.csproj \
            src/nextorm.mariadb/nextorm.mariadb.csproj \
            src/nextorm.clickhouse/nextorm.clickhouse.csproj \
            src/nextorm.extensions/nextorm.extensions.csproj \
            src/nextorm.entityframeworkcore/nextorm.entityframeworkcore.csproj
          do
            dotnet pack "$project" -c Release -p:Version="$VERSION" -o ./nupkgs
          done
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
