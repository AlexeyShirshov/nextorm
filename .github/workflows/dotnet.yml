# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  # Every push to every branch (and tag): the run is attached to the commit, so it also shows up
  # in the "Checks" tab of any pull request - no separate pull_request trigger needed.
  push:
  # Manual (re)publish of an existing tag, e.g. `v1.0.3-alpha`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.3-alpha)"
        required: true

# Cancel a superseded run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIN_LINE_COVERAGE: 85
      MIN_BRANCH_COVERAGE: 75

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Restore local tools
        run: dotnet tool restore
      - name: Test with coverage
        run: |
          mkdir -p tests/coverage
          dotnet tool run dotnet-coverage collect -s coverage.settings.xml -f cobertura -o tests/coverage/coverage.cobertura.xml "dotnet test --no-build --verbosity normal"
      - name: Allocation regression gate
        timeout-minutes: 20
        run: |
          mkdir -p /tmp/nextorm-bench-gate
          export NEXTORM_BENCH_DB=/tmp/nextorm-bench-gate/test.db
          python3 -m unittest discover -s eng/perf/tests -p 'test_iteration14_gate.py'
          python3 eng/perf/iteration14_gate.py --timeout 1200
      - name: Coverage report
        run: |
          dotnet tool run reportgenerator \
            -reports:tests/coverage/coverage.cobertura.xml \
            -targetdir:tests/coverage/report \
            -reporttypes:"Html;TextSummary;Cobertura" \
            -riskhotspotassemblyfilters:"+nextorm.*"
      - name: Enforce coverage thresholds
        run: |
          SUMMARY=tests/coverage/report/Summary.txt
          LINE=$(grep -oP 'Line coverage: \K[0-9.]+' "$SUMMARY")
          BRANCH=$(grep -oP 'Branch coverage: \K[0-9.]+' "$SUMMARY")
          echo "Line coverage: ${LINE}% (threshold: ${MIN_LINE_COVERAGE}%)"
          echo "Branch coverage: ${BRANCH}% (threshold: ${MIN_BRANCH_COVERAGE}%)"
          FAIL=0
          awk -v c="$LINE" -v min="$MIN_LINE_COVERAGE" 'BEGIN { exit (c + 0 < min) }' || FAIL=1
          awk -v c="$BRANCH" -v min="$MIN_BRANCH_COVERAGE" 'BEGIN { exit (c + 0 < min) }' || FAIL=1
          if [ "$FAIL" -eq 0 ]; then
            echo "Coverage OK"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "::error::Coverage below threshold (line ${LINE}% < ${MIN_LINE_COVERAGE}% or branch ${BRANCH}% < ${MIN_BRANCH_COVERAGE}%)"
            exit 1
          else
            echo "::warning::Coverage below threshold (line ${LINE}% < ${MIN_LINE_COVERAGE}% or branch ${BRANCH}% < ${MIN_BRANCH_COVERAGE}%); hard-fails on main only"
          fi
      - name: Coverage summary
        if: always()
        run: |
          SUMMARY=tests/coverage/report/Summary.txt

          {
            if [ -f "$SUMMARY" ]; then
              LINE=$(grep -oP 'Line coverage: \K[0-9.]+' "$SUMMARY")
              BRANCH=$(grep -oP 'Branch coverage: \K[0-9.]+' "$SUMMARY")

              echo "## Line coverage: ${LINE}% (threshold: ${MIN_LINE_COVERAGE}%)"
              echo
              echo "## Branch coverage: ${BRANCH}% (threshold: ${MIN_BRANCH_COVERAGE}%)"
              echo
              LINE_OK=1; BRANCH_OK=1
              awk -v c="$LINE" -v min="$MIN_LINE_COVERAGE" 'BEGIN { exit (c + 0 < min) }' || LINE_OK=0
              awk -v c="$BRANCH" -v min="$MIN_BRANCH_COVERAGE" 'BEGIN { exit (c + 0 < min) }' || BRANCH_OK=0
              if [ "$LINE_OK" -eq 1 ] && [ "$BRANCH_OK" -eq 1 ]; then
                echo "Coverage thresholds: **OK**"
              else
                echo "Coverage thresholds: **FAILED** (line: $([ "$LINE_OK" -eq 1 ] && echo ok || echo low); branch: $([ "$BRANCH_OK" -eq 1 ] && echo ok || echo low))"
              fi
              echo
              echo "| Assembly | Line coverage |"
              echo "|---|---|"
              grep -E '^nextorm\.[a-z]+ +[0-9.]+%' "$SUMMARY" | tr -d '\r' | awk '{printf "| %s | %s |\n", $1, $NF}'
              echo
              echo "Full HTML report (with risk hotspots): artifact \`coverage-report\`, open \`report/index.html\`."
            else
              echo "## Coverage"
              echo
              echo "The coverage report was not produced - see the log of the previous steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: tests/coverage/
          if-no-files-found: ignore

  publish:
    # A tag push publishes to nuget.org; a manual run re-publishes an existing tag. Ordinary
    # branch pushes only build and test.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        run: dotnet restore
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          for project in \
            src/nextorm.core/nextorm.core.csproj \
            src/nextorm.sqlite/nextorm.sqlite.csproj \
            src/nextorm.sqlserver/nextorm.sqlserver.csproj \
            src/nextorm.postgres/nextorm.postgres.csproj \
            src/nextorm.mysql/nextorm.mysql.csproj \
            src/nextorm.mariadb/nextorm.mariadb.csproj \
            src/nextorm.clickhouse/nextorm.clickhouse.csproj
          do
            dotnet pack "$project" -c Release -p:Version="$VERSION" -o ./nupkgs
          done
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
