# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Restore local tools
        run: dotnet tool restore
      - name: Test with coverage
        run: |
          mkdir -p coverage
          dotnet tool run dotnet-coverage collect -s coverage.settings.xml -f cobertura -o coverage/coverage.cobertura.xml "dotnet test --no-build --verbosity normal"
      - name: Coverage report
        run: |
          dotnet tool run reportgenerator \
            -reports:coverage/coverage.cobertura.xml \
            -targetdir:coverage/report \
            -reporttypes:"Html;TextSummary;Cobertura" \
            -riskhotspotassemblyfilters:"+nextorm.*"
      - name: Enforce line coverage threshold
        run: |
          LINE=$(grep -oP 'Line coverage: \K[0-9.]+' coverage/report/Summary.txt)
          echo "Line coverage: ${LINE}% (threshold: 60%)"
          if awk -v c="$LINE" 'BEGIN { exit (c + 0 < 60) }'; then
            echo "Coverage OK"
          else
            echo "::error::Line coverage ${LINE}% is below the 60% threshold"
            exit 1
          fi
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
