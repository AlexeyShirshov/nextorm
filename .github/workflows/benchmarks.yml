name: benchmarks

# Re-runs the SQLite comparison benchmarks (end-to-end + Category B warm-cache), regenerates the
# tables in readme.md and docs/comparisons/benchmarks.md (EN + RU) and opens a pull request with the
# refreshed reports. The tables are derived data: scripts/perf/update_benchmark_tables.py owns them, so a
# scheduled run cannot leave the prose behind.
on:
  # Manual refresh at any time.
  workflow_dispatch:
  # Monthly refresh on the first day of the month.
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore benchmark project
        run: dotnet restore benchmarks/nextorm.benchmark
      - name: Build benchmark project (Release)
        run: dotnet build benchmarks/nextorm.benchmark -c Release --no-restore

      - name: Run comparison benchmarks
        shell: bash
        run: |
          set -euo pipefail
          # Seed in a disposable copy: the tracked data/test.db must stay untouched.
          export NEXTORM_BENCH_DB="$RUNNER_TEMP/nextorm-bench/test.db"
          mkdir -p "$(dirname "$NEXTORM_BENCH_DB")"
          cp benchmarks/nextorm.benchmark/data/test.db "$NEXTORM_BENCH_DB"
          touch "$RUNNER_TEMP/bench-start"

          # Full globs (BDN rejects an exact-suffix filter): "*SqliteBenchmarkIteration*" does not
          # match SqliteBenchmarkLargeIteration because the type name differs after "SqliteBenchmark".
          filters=(
            "*SqliteBenchmarkIteration*"
            "*SqliteBenchmarkLargeIteration*"
            "*SqliteBenchmarkWhere*"
            "*SqliteBenchmarkSimulateWork*"
            "*SqliteBenchmarkAny*"
            "*SqliteBenchmarkFirst*"
            "*SqliteBenchmarkSingle*"
            "*SqliteBenchmarkFeaturesFairCached*"
          )
          for filter in "${filters[@]}"; do
            echo "::group::${filter}"
            dotnet run --project benchmarks/nextorm.benchmark -c Release --no-build -- \
              --filter "${filter}"
            echo "::endgroup::"
          done

          # A typo in the filter makes BDN exit 0 without running anything; require every report
          # to have been rewritten by this job.
          results="benchmarks/BenchmarkDotNet.Artifacts/results"
          for class in SqliteBenchmarkIteration SqliteBenchmarkLargeIteration SqliteBenchmarkWhere \
                       SqliteBenchmarkSimulateWork SqliteBenchmarkAny SqliteBenchmarkFirst \
                       SqliteBenchmarkSingle SqliteBenchmarkFeaturesFairCached; do
            report="${results}/NextORM.Benchmark.${class}-report-github.md"
            if [ ! -f "$report" ] || [ "$report" -ot "$RUNNER_TEMP/bench-start" ]; then
              echo "::error::${class} did not produce a fresh report"
              exit 1
            fi
          done

      - name: Regenerate tables from the new reports
        run: python3 scripts/perf/update_benchmark_tables.py

      - name: Verify the tables match the reports
        run: python3 scripts/perf/update_benchmark_tables.py --check

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: chore/benchmark-tables
          delete-branch: true
          title: "chore(benchmarks): refresh comparison tables"
          commit-message: |
            chore(benchmarks): refresh comparison tables

            Regenerated by .github/workflows/benchmarks.yml from the attached
            BenchmarkDotNet reports (scripts/perf/update_benchmark_tables.py).
          body: |
            Automated benchmark refresh.

            - Machine: the GitHub Actions `ubuntu-latest` runner, **not** the Ryzen 7 5800HS used
              for earlier numbers. The conditions line in `readme.md` is regenerated from the report
              header, so the published machine/cores/runtime stay truthful.
            - Suites: end-to-end comparison (7 classes) and Category B (warm cached vs regular).
            - Source of truth: the committed `NextORM.Benchmark.*-report-*` files under
              `benchmarks/BenchmarkDotNet.Artifacts/results/`.

            Review the diff before merging: `ShortRun` + `InProcessEmitToolchain` is exploratory, so
            treat deltas below ~20% as noise.
